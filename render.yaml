services:
  - type: web
    name: rat-racer-bdq
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run serve
    envVars:
      - key: AUTO_FETCH_INTERVAL_SECONDS
        value: '1800'
      - key: ALLOW_HTML_SCRAPING
        value: 'false'
      - key: INCLUDE_REMOTE_INDIA
        value: 'true'
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: DASHBOARD_URL
        sync: false
